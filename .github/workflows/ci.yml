name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Pinned to 24.04: ubuntu-latest migrates to 26.x (Oct 2026) — pin avoids surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # No `version` key: pnpm/action-setup reads packageManager (pnpm@9.7.0)
      # from package.json — a single source of truth, no mismatch warnings.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: node scripts/bundle-budget.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
